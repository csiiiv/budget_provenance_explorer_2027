name: NIA document coverage checks
# Temporarily manual-only while prioritizing usable Pages deployments.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: node --test web/tests/niaCoverage.test.mjs web/tests/niaCoordinateCoverage.test.mjs
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: test -s web/dist/data/nia-document-coverage.json && test -s web/dist/nia-documents.html
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python3 -m pip install playwright==1.55.0
          if [ ! -x /usr/bin/google-chrome ]; then
            python3 -m playwright install --with-deps chromium
          fi
      - run: python3 web/tests/check_nia_landing.py
      - run: python3 web/check_nia_supporting_docs.py
      - run: node --test web/tests/niaPublicDocuments.test.mjs
      - run: python3 web/tests/check_nia_coordinates.py
